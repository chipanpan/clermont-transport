steps:
  - name: 'python:3.11-slim'
    id: 'dbt-deps'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        pip install --no-cache-dir dbt-bigquery
        cd transform
        dbt deps --profiles-dir .

  - name: 'python:3.11-slim'
    id: 'dbt-debug'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        pip install --no-cache-dir dbt-bigquery
        cd transform
        dbt debug --target prod --profiles-dir .

  - name: 'python:3.11-slim'
    id: 'dbt-build'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        pip install --no-cache-dir dbt-bigquery
        cd transform
        dbt build --target prod --profiles-dir .

options:
  logging: CLOUD_LOGGING_ONLY
