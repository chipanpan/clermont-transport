steps:
  - name: 'ghcr.io/dbt-labs/dbt-bigquery:1.8'
    id: 'dbt-deps'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        cd transform
        dbt deps --profiles-dir .

  - name: 'ghcr.io/dbt-labs/dbt-bigquery:1.8'
    id: 'dbt-debug'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        cd transform
        dbt debug --target prod --profiles-dir .

  - name: 'ghcr.io/dbt-labs/dbt-bigquery:1.8'
    id: 'dbt-build'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        cd transform
        dbt build --target prod --profiles-dir .

options:
  logging: CLOUD_LOGGING_ONLY
